<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- กำหนด Viewport ป้องกันการขยาย/ย่อหน้าจอผิดสเกล -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Terrabit Chat</title>
  <link rel="icon" href="TRB-logo.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* ใช้ Dynamic Viewport Height สำหรับมือถือ */
      overflow: hidden; /* ป้องกันการสโครลซ้ำซ้อนนอก iframe */
      background-color: #ffffff;
    }

    .app-iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    class="app-iframe"
    src="https://script.google.com/macros/s/AKfycbwD2Lioe0guEDRUgD4ruSpjMo1j30bkzAo9w0XpOxdd7tTRTs5zNKUHv_pwV9kkmibiGA/exec"
    allow="geolocation; microphone; camera; clipboard-write;"
    allowfullscreen>
  </iframe>

</body>
</html>
